<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">
  <title>egzo-hub architecture</title>
  <style>
    :root { --bg:#ffffff; --fg:#1f2933; --muted:#616e7c; --line:#52606d; --box:#f5f7fa; --hub:#eef4ff; --hubline:#3b6fd4; --bridge:#f3ecff; --bridgeline:#7b4fd1; --engine:#eefaf1; --engineline:#2f9e5b; --warn:#fff6e5; --warnline:#d98a00; }
    @media (prefers-color-scheme: dark) { :root { --bg:#161b22; --fg:#e6edf3; --muted:#9aa7b4; --line:#8b98a5; --box:#212830; --hub:#1b2a44; --hubline:#6c97ee; --bridge:#2a2142; --bridgeline:#a58af0; --engine:#17301f; --engineline:#4cc481; --warn:#3a2d12; --warnline:#e0a030; } }
    .bg { fill: var(--bg); }
    text { fill: var(--fg); }
    .m { fill: var(--muted); font-size: 11.5px; }
    .t { font-weight: 600; }
    .box { fill: var(--box); stroke: var(--line); stroke-width: 1.2; }
    .dash { stroke-dasharray: 5 4; }
    .hub { fill: var(--hub); stroke: var(--hubline); stroke-width: 1.6; }
    .bridge { fill: var(--bridge); stroke: var(--bridgeline); stroke-width: 1.6; }
    .engine { fill: var(--engine); stroke: var(--engineline); stroke-width: 1.6; }
    .warn { fill: var(--warn); stroke: var(--warnline); stroke-width: 1.2; }
    .ln { stroke: var(--line); stroke-width: 1.4; fill: none; marker-end: url(#a); }
    .ln2 { stroke: var(--line); stroke-width: 1.4; fill: none; marker-end: url(#a); marker-start: url(#as); }
    .cred { stroke: var(--warnline); stroke-width: 1.8; fill: none; marker-end: url(#aw); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52606d"/></marker>
    <marker id="as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0L0 5L10 10z" fill="#52606d"/></marker>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d98a00"/></marker>
  </defs>
  <rect class="bg" width="1000" height="720"/>

  <!-- people and edge -->
  <rect class="box" x="40" y="40" width="140" height="50" rx="8"/>
  <text x="110" y="62" text-anchor="middle" class="t">Browser</text>
  <text x="110" y="79" text-anchor="middle" class="m">web UI + xterm.js</text>

  <rect class="box dash" x="250" y="40" width="200" height="50" rx="8"/>
  <text x="350" y="62" text-anchor="middle" class="t">TLS reverse proxy</text>
  <text x="350" y="79" text-anchor="middle" class="m">out of scope, X-Forwarded-*</text>

  <path class="ln" d="M180 65 H250"/>
  <path class="ln" d="M350 90 V150"/>

  <!-- identity -->
  <rect class="box dash" x="790" y="40" width="170" height="50" rx="8"/>
  <text x="875" y="62" text-anchor="middle" class="t">GitHub / any IdP</text>
  <text x="875" y="79" text-anchor="middle" class="m">the user's choice</text>
  <rect class="box" x="790" y="165" width="170" height="50" rx="8"/>
  <text x="875" y="187" text-anchor="middle" class="t">Dex</text>
  <text x="875" y="204" text-anchor="middle" class="m">OIDC, compose service</text>
  <path class="ln2" d="M875 165 V90"/>
  <path class="ln2" d="M730 190 H790"/>
  <text x="760" y="182" text-anchor="middle" class="m">OIDC</text>

  <!-- hub -->
  <rect class="hub" x="230" y="150" width="520" height="250" rx="12"/>
  <text x="250" y="172" class="t" style="font-size:15px">egzo-hub</text>
  <text x="740" y="172" text-anchor="end" class="m">holds the engine credentials, enforces RBAC</text>

  <rect class="box" x="250" y="185" width="150" height="60" rx="8"/>
  <text x="325" y="208" text-anchor="middle" class="t">Embedded NATS</text>
  <text x="325" y="225" text-anchor="middle" class="m">topic per agent:</text>
  <text x="325" y="238" text-anchor="middle" class="m">agent.*.in / .out</text>

  <rect class="box" x="250" y="265" width="150" height="60" rx="8"/>
  <text x="325" y="288" text-anchor="middle" class="t">Web UI backend</text>
  <text x="325" y="305" text-anchor="middle" class="m">pages, terminal bridge,</text>
  <text x="325" y="318" text-anchor="middle" class="m">operate only</text>

  <rect class="box" x="420" y="185" width="150" height="60" rx="8"/>
  <text x="495" y="208" text-anchor="middle" class="t">RBAC</text>
  <text x="495" y="225" text-anchor="middle" class="m">user / administrator / owner</text>
  <text x="495" y="238" text-anchor="middle" class="m">on (engine, project)</text>

  <rect class="box" x="420" y="265" width="150" height="60" rx="8"/>
  <text x="495" y="288" text-anchor="middle" class="t">Hub database</text>
  <text x="495" y="305" text-anchor="middle" class="m">users, grants,</text>
  <text x="495" y="318" text-anchor="middle" class="m">(final check)</text>

  <rect class="box" x="590" y="185" width="140" height="140" rx="8"/>
  <text x="660" y="208" text-anchor="middle" class="t">Engine seam</text>
  <text x="660" y="226" text-anchor="middle" class="m">one client per engine</text>
  <text x="660" y="246" text-anchor="middle" class="m">core packages:</text>
  <text x="660" y="261" text-anchor="middle" class="m">list, spawn, start,</text>
  <text x="660" y="276" text-anchor="middle" class="m">stop, rm, attach,</text>
  <text x="660" y="291" text-anchor="middle" class="m">send, events</text>
  <text x="660" y="311" text-anchor="middle" class="m">faked in hub tests</text>

  <path class="ln" d="M400 215 H420"/>
  <path class="ln" d="M495 245 V265"/>
  <path class="ln" d="M570 215 H590"/>
  <path class="ln" d="M400 295 H410 V235 H420"/>

  <rect class="warn" x="250" y="345" width="480" height="38" rx="8"/>
  <text x="490" y="362" text-anchor="middle" class="t">Never in the hub: secret values, YAML writes</text>
  <text x="490" y="376" text-anchor="middle" class="m">project up/down, secrets and recreate stay in the CLI</text>


  <!-- bridge -->
  <rect class="bridge" x="20" y="165" width="170" height="110" rx="10"/>
  <text x="105" y="190" text-anchor="middle" class="t" style="font-size:14px">egzo-discord</text>
  <text x="105" y="209" text-anchor="middle" class="m">adapter, optional service</text>
  <text x="105" y="226" text-anchor="middle" class="m">bot token, SQLite:</text>
  <text x="105" y="240" text-anchor="middle" class="m">subscribes to all agents,</text>
  <text x="105" y="254" text-anchor="middle" class="m">exposure, user links</text>
  <text x="105" y="268" text-anchor="middle" class="m">vets what gets in</text>
  <path class="ln2" d="M190 215 H250"/>
  <text x="210" y="207" text-anchor="middle" class="m" style="font-size:10.5px">topics</text>
  <text x="210" y="233" text-anchor="middle" class="m" style="font-size:10.5px">+ API</text>

  <rect class="box" x="20" y="335" width="170" height="50" rx="8"/>
  <text x="105" y="357" text-anchor="middle" class="t">Discord</text>
  <text x="105" y="374" text-anchor="middle" class="m">Gateway + REST, one bot</text>
  <path class="ln2" d="M105 275 V335"/>

  <rect class="box" x="20" y="430" width="170" height="50" rx="8"/>
  <text x="105" y="452" text-anchor="middle" class="t">Discord users</text>
  <text x="105" y="469" text-anchor="middle" class="m">@agent in private channels</text>
  <path class="ln2" d="M105 385 V430"/>

  <!-- engines -->
  <path class="cred" d="M420 400 V440 H355 V470"/>
  <path class="cred" d="M640 400 V440 H625 V470"/>
  <text x="520" y="432" text-anchor="middle" class="m">Docker API + exec to the sidecar socket</text>

  <rect class="engine" x="230" y="470" width="250" height="170" rx="12"/>
  <text x="245" y="492" class="t">Engine A (local)</text>
  <text x="470" y="492" text-anchor="end" class="m">unix socket</text>
  <rect class="box" x="245" y="505" width="220" height="38" rx="6"/>
  <text x="355" y="522" text-anchor="middle" class="t" style="font-size:12px">control sidecar</text>
  <text x="355" y="536" text-anchor="middle" class="m" style="font-size:10.5px">operator API, events, spec snapshot</text>
  <rect class="box" x="245" y="551" width="105" height="34" rx="6"/>
  <text x="297" y="572" text-anchor="middle" class="m" style="font-size:11px">proxy / egress</text>
  <rect class="box" x="360" y="551" width="105" height="34" rx="6"/>
  <text x="412" y="572" text-anchor="middle" class="m" style="font-size:11px">agents</text>
  <text x="355" y="613" text-anchor="middle" class="m">labels ai.egzo.*, project volumes</text>

  <rect class="engine" x="500" y="470" width="250" height="170" rx="12"/>
  <text x="515" y="492" class="t">Engine B (remote)</text>
  <text x="740" y="492" text-anchor="end" class="m">tcp+TLS or ssh</text>
  <rect class="box" x="515" y="505" width="220" height="38" rx="6"/>
  <text x="625" y="522" text-anchor="middle" class="t" style="font-size:12px">control sidecar</text>
  <text x="625" y="536" text-anchor="middle" class="m" style="font-size:10.5px">operator API, events, spec snapshot</text>
  <rect class="box" x="515" y="551" width="105" height="34" rx="6"/>
  <text x="567" y="572" text-anchor="middle" class="m" style="font-size:11px">proxy / egress</text>
  <rect class="box" x="630" y="551" width="105" height="34" rx="6"/>
  <text x="682" y="572" text-anchor="middle" class="m" style="font-size:11px">agents</text>
  <text x="625" y="613" text-anchor="middle" class="m">same shape on every engine</text>

  <!-- CLI -->
  <rect class="box" x="790" y="500" width="170" height="70" rx="8"/>
  <text x="875" y="523" text-anchor="middle" class="t">egzo CLI</text>
  <text x="875" y="541" text-anchor="middle" class="m">project up / down, secrets,</text>
  <text x="875" y="555" text-anchor="middle" class="m">egzo.yaml: the only writer</text>
  <path class="ln" d="M790 530 H750"/>

  <!-- legend -->
  <line x1="40" y1="672" x2="80" y2="672" class="cred" style="marker-end:url(#aw)"/>
  <text x="90" y="676" class="m">engine credentials: held only by the hub</text>
  <line x1="410" y1="672" x2="450" y2="672" class="ln"/>
  <text x="460" y="676" class="m">authenticated calls</text>
  <rect x="590" y="664" width="30" height="14" rx="3" class="box dash"/>
  <text x="630" y="676" class="m">outside egzo</text>
  <text x="40" y="704" class="m">The hub double-checks every message to an agent; a stolen bot token cannot spawn, attach or reach engines.</text>
</svg>
