name: release

# A tag without a "v" (0.1.0, 0.1.0-rc1) builds and publishes everything under that version, so the image tags,
# `egzo version` and the release all agree. A tag with a "-" is a pre-release: it is not tagged `latest`.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/egzo-ai
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  binaries:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-X github.com/egzo-ai/egzo/internal/version.Version=${GITHUB_REF_NAME}" \
              -o dist/egzo-linux-$arch ./cmd/egzo
          done
          cd dist && sha256sum egzo-linux-* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: dist/*
          if-no-files-found: error

  images:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        run: |
          # `latest` only for a full release, never for a pre-release tag
          for image in egzo egzo-harness-claude-code egzo-harness-opencode; do
            tags="$REGISTRY/$image:$GITHUB_REF_NAME"
            case "$GITHUB_REF_NAME" in *-*) ;; *) tags="$tags,$REGISTRY/$image:latest" ;; esac
            echo "$image=$tags" >> "$GITHUB_OUTPUT"
          done
      - name: egzo (sidecar) image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          provenance: mode=max
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.tags.outputs['egzo'] }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=AGPL-3.0-only
      # The harness images copy the binary out of the egzo image pushed just above.
      - name: claude-code harness image
        uses: docker/build-push-action@v7
        with:
          context: harness/claude-code
          platforms: ${{ env.PLATFORMS }}
          push: true
          provenance: mode=max
          build-args: EGZO_IMAGE=${{ env.REGISTRY }}/egzo:${{ github.ref_name }}
          tags: ${{ steps.tags.outputs['egzo-harness-claude-code'] }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=AGPL-3.0-only
      - name: opencode harness image
        uses: docker/build-push-action@v7
        with:
          context: harness/opencode
          platforms: ${{ env.PLATFORMS }}
          push: true
          provenance: mode=max
          build-args: EGZO_IMAGE=${{ env.REGISTRY }}/egzo:${{ github.ref_name }}
          tags: ${{ steps.tags.outputs['egzo-harness-opencode'] }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=AGPL-3.0-only

  release:
    needs: [binaries, images]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: dist
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; *) pre="" ;; esac
          gh release create "$GITHUB_REF_NAME" $pre --verify-tag --generate-notes --title "egzo $GITHUB_REF_NAME" dist/*
