# TEMPORARY: do the failing rootful Podman specs pass with network setup serialized? Removed once confirmed.
name: debug-podman
on:
  push:
    branches: [ci-spec-matrix]
jobs:
  debug:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: scripts/ci-engine.sh podman
      - run: |
          make build
          python -m venv specs/.venv
          specs/.venv/bin/pip install -r specs/requirements.txt
      - run: docker run -d --name spec-registry -p 5000:5000 registry:2
      - name: Record bridge forwarding changes and Podman events
        run: |
          cat > /tmp/fw.sh <<'SH'
          declare -A last
          while true; do
            for b in $(ip -br link | awk '/^podman[0-9]/{print $1}'); do
              v=$(cat /proc/sys/net/ipv4/conf/$b/forwarding 2>/dev/null); a=$(ip -br addr show $b | awk '{print $3}' | cut -d/ -f1)
              if [ "${last[$b]}" != "$v $a" ]; then echo "$(date +%T.%N | cut -c1-12) BRIDGE $b $a forwarding=$v (was ${last[$b]:-new})" >> /tmp/timeline.log; last[$b]="$v $a"; fi
            done
            for b in "${!last[@]}"; do ip link show $b >/dev/null 2>&1 || { echo "$(date +%T.%N | cut -c1-12) BRIDGE $b gone" >> /tmp/timeline.log; unset last[$b]; }; done
            sleep 0.05
          done
          SH
          nohup bash /tmp/fw.sh >/dev/null 2>&1 &
          nohup sudo sh -c "podman events --format '{{.Time}} EVENT {{.Type}} {{.Status}} {{.Name}} {{index .Attributes \"network\"}}' --stream" >> /tmp/events-raw.log 2>&1 &
          nohup sh -c "sudo podman events --stream --format json | python3 -c \"import sys,json,datetime
for l in sys.stdin:
    e=json.loads(l); t=datetime.datetime.fromtimestamp(e.get('time',0)).strftime('%H:%M:%S.%f')[:12]
    print(t,'EVENT',e.get('Type'),e.get('Status'),e.get('Name'),(e.get('Attributes') or {}).get('network',''),flush=True)\"" >> /tmp/timeline.log 2>&1 &
      - name: Specs
        working-directory: specs
        env:
          EGZO_BIN: ${{ github.workspace }}/bin/egzo
        run: |
          set -o pipefail
          ../specs/.venv/bin/pytest --engine podman -q workspace/test_git_workspaces.py 2>&1 | tee ../specs-debug.log
      - name: Timeline
        if: always()
        run: sort /tmp/timeline.log > /tmp/timeline.sorted; grep -c . /tmp/timeline.sorted; cat /tmp/timeline.sorted | cut -c1-200
      - name: Annotate
        if: always()
        run: scripts/ci-annotate.sh "debug" specs-debug.log specs
