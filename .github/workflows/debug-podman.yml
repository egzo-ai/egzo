# TEMPORARY: which resolved addresses a rootful Podman container cannot reach. Removed once understood.
name: debug-podman
on:
  push:
    branches: [ci-spec-matrix]
jobs:
  debug:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: scripts/ci-engine.sh podman
      - run: sudo apt-get install -y -qq dnsutils >/dev/null
      - name: Addresses
        run: |
          set +e
          resolvectl status 2>&1 | head -12; cat /etc/resolv.conf | grep -v '^#'
          sudo podman network create probe >/dev/null
          for host in github.com httpbin.org example.com; do
            echo "=== $host: host resolver"; dig +short $host | tr '\n' ' '; echo
            echo "=== $host: from a rootful podman container (aardvark)"
            sudo podman run --rm --network probe docker.io/library/alpine:3 sh -c "nslookup $host 2>&1 | grep -E '^Address' | tail -n +2 | tr '\n' ' '"; echo
            for ip in $(for i in 1 2 3; do dig +short $host; done | grep -E '^[0-9.]+$' | sort -u); do
              h=$(timeout 5 curl -sS -o /dev/null -m 5 --resolve $host:443:$ip -w '%{http_code}' https://$host/ 2>&1 | tail -c 60)
              p=$(sudo podman run --rm --network probe docker.io/curlimages/curl:8.10.1 -sS -o /dev/null -m 5 --resolve $host:443:$ip -w '%{http_code}' https://$host/ 2>&1 | tail -c 60)
              d=$(docker run --rm docker.io/curlimages/curl:8.10.1 -sS -o /dev/null -m 5 --resolve $host:443:$ip -w '%{http_code}' https://$host/ 2>&1 | tail -c 60)
              echo "$host $ip  host=[$h] podman=[$p] docker=[$d]"
            done
          done
