# TEMPORARY: the rootful Podman failures of the specs, without the 50 minutes. Removed once they are fixed.
name: debug-podman
on:
  push:
    branches: [ci-spec-matrix]
jobs:
  debug:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: scripts/ci-engine.sh podman
      - run: |
          make build
          python -m venv specs/.venv
          specs/.venv/bin/pip install -r specs/requirements.txt
      - run: docker run -d --name spec-registry -p 5000:5000 registry:2
      - name: Egress from a custom network
        run: |
          set +e
          sudo iptables -S FORWARD | head -5; sudo iptables -L FORWARD -n | head -3; sudo nft list tables
          attempt() {
            ok=0
            for i in 1 2 3 4 5 6 7 8; do
              sudo podman network create n$i-$1 >/dev/null
              sudo podman run --rm --network n$i-$1 docker.io/curlimages/curl:8.10.1 -sS -o /dev/null -m 8 -w '%{http_code}' https://example.com/ >/tmp/o 2>&1 && ok=$((ok+1))
              sudo podman network rm n$i-$1 >/dev/null
            done
            echo "$1: $ok of 8 worked"
          }
          attempt before
          sudo iptables -P FORWARD ACCEPT
          attempt accept
      - name: Specs
        working-directory: specs
        env:
          EGZO_BIN: ${{ github.workspace }}/bin/egzo
        run: |
          set -o pipefail
          ../specs/.venv/bin/pytest --engine podman -q agent/test_agent_containers.py 2>&1 | tee ../specs-debug.log
      - name: Annotate
        if: failure()
        run: scripts/ci-annotate.sh "debug specs" specs-debug.log specs
