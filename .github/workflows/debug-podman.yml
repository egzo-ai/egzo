# TEMPORARY: when a proxy loses its way out on rootful Podman. Removed once understood.
name: debug-podman
on:
  push:
    branches: [ci-spec-matrix]
jobs:
  debug:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: scripts/ci-engine.sh podman
      - run: |
          make build
          python -m venv specs/.venv
          specs/.venv/bin/pip install -r specs/requirements.txt
      - run: docker run -d --name spec-registry -p 5000:5000 registry:2
      - name: Sample every proxy while the specs run
        run: |
          cat > /tmp/sample.sh <<'SH'
          while true; do
            for id in $(sudo podman ps -q --filter name=-proxy-1); do
              pid=$(sudo podman inspect -f '{{.State.Pid}}' $id 2>/dev/null) || continue
              name=$(sudo podman inspect -f '{{.Name}}' $id | sed 's/^spec-//; s/-proxy-1//')
              nets=$(sudo nsenter -t $pid -n ip -br addr | awk '$1 ~ /^eth/ {printf "%s=%s ", $1, $3}')
              route=$(sudo nsenter -t $pid -n ip route | awk '/^default/{print $3, $5}')
              t=""
              for ip in 140.82.114.3 104.20.23.154 100.56.179.159; do
                if sudo nsenter -t $pid -n timeout 3 bash -c "exec 3<>/dev/tcp/$ip/443" 2>/dev/null; then t="$t $ip:ok"; else t="$t $ip:FAIL"; fi
              done
              echo "$(date +%T) $name default[$route] $nets $t" >> /tmp/samples.log
              case "$t" in *FAIL*)
                if ! grep -q "^$name" /tmp/dumped 2>/dev/null; then
                  echo "$name" >> /tmp/dumped
                  {
                    echo "######## BAD PROXY $name at $(date +%T)  [$route] $nets"
                    echo "--- podman networks"; sudo podman network ls --format '{{.Name}} {{.ID}} subnet={{range .Subnets}}{{.Subnet}}{{end}} internal={{.Internal}}'
                    echo "--- host links"; ip -br link | awk '{print $1, $2}' | grep -E "podman|br-|veth|docker" | head -40
                    echo "--- host addr 10.89"; ip -br addr | grep 10.89
                    echo "--- host routes 10.89"; ip route | grep 10.89
                    echo "--- ip rules"; ip rule
                    echo "--- iptables nat POSTROUTING"; sudo iptables -t nat -S | grep -E "10.89|NETAVARK" | head -30
                    echo "--- nft netavark tables"; sudo nft list tables; sudo nft list ruleset 2>/dev/null | grep -n -E "10\.89\.(0|3)\.0/24|netavark" | head -40
                    echo "--- FORWARD chains with counters"; sudo iptables -L FORWARD -v -n --line-numbers | head -20; sudo iptables -S | grep -E "^-N|^-P" | head -30
                    echo "--- isolation chains"; for c in 1 2 3 4; do sudo iptables -L NETAVARK_ISOLATION_$c -v -n 2>&1 | head -14; done
                    echo "--- bridge to podman network"; for b in $(ip -br link | awk '/^podman[0-9]/{print $1}'); do echo "$b $(ip -br addr show $b | awk '{print $3}')"; done
                    echo "--- NETAVARK_FORWARD"; sudo iptables -L NETAVARK_FORWARD -v -n --line-numbers 2>&1 | head -20
                    echo "--- DOCKER-USER / DOCKER-FORWARD"; sudo iptables -L DOCKER-USER -v -n 2>&1 | head -6; sudo iptables -L DOCKER-FORWARD -v -n 2>&1 | head -12
                    echo "--- sysctl"; sysctl net.ipv4.ip_forward net.bridge.bridge-nf-call-iptables net.ipv4.conf.all.rp_filter 2>&1
                    echo "--- proxy ns arp/neigh"; sudo nsenter -t $pid -n ip neigh
                    echo "--- ping gateway from the proxy ns"; sudo nsenter -t $pid -n ping -c 2 -W 1 $(echo $route | awk '{print $1}') 2>&1 | tail -3
                  } >> /tmp/dump.log 2>&1
                fi;;
              esac
            done
            sleep 5
          done
          SH
          nohup bash /tmp/sample.sh >/dev/null 2>&1 &
          cat > /tmp/events.sh <<'SH'
          seen=""
          while true; do
            for id in $(sudo podman ps -q --filter name=-proxy-1); do
              case " $seen " in *" $id "*) continue;; esac
              seen="$seen $id"
              n=$(sudo podman inspect -f '{{.Name}}' $id | sed 's/^spec-//; s/-proxy-1//')
              sudo nohup sh -c "podman logs -f $id 2>&1 | sed \"s/^/\$(date +%T) $n /\" " >> /tmp/events.log 2>&1 &
            done
            sleep 2
          done
          SH
          nohup bash /tmp/events.sh >/dev/null 2>&1 &
      - name: Specs
        working-directory: specs
        env:
          EGZO_BIN: ${{ github.workspace }}/bin/egzo
        run: |
          set -o pipefail
          ../specs/.venv/bin/pytest --engine podman -q workspace/test_git_workspaces.py proxy/test_proxy_secrets.py 2>&1 | tee ../specs-debug.log
      - name: Timeline
        if: always()
        run: |
          grep -E '"action":"(error|deny)"' /tmp/events.log | grep -v "egress profile" | cut -c1-220
          echo ----- samples with a failure, and the lines around
          grep -n FAIL /tmp/samples.log | head -5
          echo ----- per proxy: first and last sample, and every change
          awk '{k=$2; sig=$0; sub(/^[0-9:]+ /,"",sig); if (sig != last[k]) {print; last[k]=sig}}' /tmp/samples.log | cut -c1-230 | head -120
      - name: The dump
        if: always()
        run: cat /tmp/dump.log
      - name: Annotate
        if: always()
        run: |
          { head -c 6800 /tmp/dump.log | sed -n "/isolation chains/,/NETAVARK_FORWARD/p"; } > debug-dump.log; scripts/ci-annotate.sh "dump" debug-dump.log tail || true
          { grep -E "^(FAILED)" specs-debug.log | cut -c1-200; echo ---- errors; grep -E '"action":"error"' /tmp/events.log | cut -c1-250 | head; echo ---- changes; awk '{k=$2; sig=$0; sub(/^[0-9:]+ /,"",sig); if (sig != last[k]) {print; last[k]=sig}}' /tmp/samples.log | cut -c1-200 | head -40; } > debug-all.log
          scripts/ci-annotate.sh "debug" debug-all.log tail
