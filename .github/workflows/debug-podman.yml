# TEMPORARY: the rootful Podman failures of the specs, without the 50 minutes. Removed once they are fixed.
name: debug-podman
on:
  push:
    branches: [ci-spec-matrix]
jobs:
  debug:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: scripts/ci-engine.sh podman
      - run: |
          make build
          python -m venv specs/.venv
          specs/.venv/bin/pip install -r specs/requirements.txt
      - run: docker run -d --name spec-registry -p 5000:5000 registry:2
      - name: Volume ownership
        run: |
          set +e
          sudo podman volume create v1 >/dev/null
          sudo podman run --rm -v v1:/volume0 --cap-drop ALL --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add FOWNER --security-opt no-new-privileges alpine:3 sh -c 'stat -c %u:%g /volume0; chown 1001:1001 /volume0; stat -c %u:%g /volume0'
          echo "--- second container, no user"; sudo podman run --rm -v v1:/w alpine:3 stat -c %u:%g /w
          echo "--- second container, user 1001"; sudo podman run --rm --user 1001:1001 -v v1:/w alpine:3 stat -c %u:%g /w
          echo "--- again"; sudo podman run --rm -v v1:/w alpine:3 stat -c %u:%g /w
          sudo podman volume inspect v1 | head -30
      - name: Specs
        working-directory: specs
        env:
          EGZO_BIN: ${{ github.workspace }}/bin/egzo
        run: |
          set -o pipefail
          ../specs/.venv/bin/pytest --engine podman -q harness/test_harness_integrations.py agent/test_agent_containers.py 2>&1 | tee ../specs-debug.log
      - name: Annotate
        if: failure()
        run: scripts/ci-annotate.sh "debug specs" specs-debug.log specs
