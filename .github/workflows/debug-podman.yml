# TEMPORARY: the rootful Podman failures of the specs, without the 50 minutes. Removed once they are fixed.
name: debug-podman
on:
  push:
    branches: [ci-spec-matrix]
jobs:
  debug:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: scripts/ci-engine.sh podman
      - run: |
          make build
          python -m venv specs/.venv
          specs/.venv/bin/pip install -r specs/requirements.txt
      - run: docker run -d --name spec-registry -p 5000:5000 registry:2
      - name: Who runs what
        run: |
          set +e
          probe='ls -l /run/podman-init; ls -ln /proc/1/exe; echo x > /proc/1/fd/1 && echo WRITE-OK; grep -E "Cap(Eff|Bnd)|NoNewPrivs|Seccomp" /proc/self/status; cat /proc/1/attr/current /proc/self/attr/current'
          for flags in "" "--security-opt no-new-privileges" "--cap-drop ALL" "--cap-drop ALL --security-opt no-new-privileges" "--cap-drop ALL --security-opt no-new-privileges --security-opt apparmor=unconfined" "--cap-drop ALL --security-opt no-new-privileges --security-opt seccomp=unconfined" "--cap-drop ALL --security-opt no-new-privileges --read-only"; do
            echo "=== sudo podman run --init --user 1001:1001 $flags"
            sudo podman run --rm --init --user 1001:1001 $flags alpine:3 sh -c "$probe" 2>&1 | tr '\n' '|'; echo
          done
          aa-status 2>&1 | head -5; sudo podman info --format '{{.Host.Security}}'
      - name: Specs
        working-directory: specs
        env:
          EGZO_BIN: ${{ github.workspace }}/bin/egzo
        run: |
          set -o pipefail
          ../specs/.venv/bin/pytest --engine podman -q harness/test_harness_integrations.py -k "invoking" session/test_session_attach.py 2>&1 | tee ../specs-debug.log
      - name: Annotate
        if: failure()
        run: scripts/ci-annotate.sh "debug specs" specs-debug.log specs
