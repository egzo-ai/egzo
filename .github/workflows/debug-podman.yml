# TEMPORARY: the rootful Podman failures of the specs, without the 50 minutes. Removed once they are fixed.
name: debug-podman
on:
  push:
    branches: [ci-spec-matrix]
jobs:
  debug:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: scripts/ci-engine.sh podman
      - run: |
          make build
          python -m venv specs/.venv
          specs/.venv/bin/pip install -r specs/requirements.txt
      - run: docker run -d --name spec-registry -p 5000:5000 registry:2
      - name: Two networks, one of them internal
        run: |
          set +e
          sudo podman network create --internal ctl >/dev/null; sudo podman network create ext >/dev/null
          ok=0
          for i in $(seq 1 12); do
            out=$(sudo podman run --rm --network ctl --network ext docker.io/curlimages/curl:8.10.1 sh -c 'ip route | tr "\n" ";"; curl -sS -o /dev/null -m 8 -w " http=%{http_code}" https://example.com/' 2>&1)
            echo "$i: $out"; case "$out" in *http=200) ok=$((ok+1));; esac
          done
          echo "both-networks: $ok of 12 worked"
          ok=0
          for i in $(seq 1 12); do
            out=$(sudo podman run --rm --network ctl:metric=900 --network ext docker.io/curlimages/curl:8.10.1 sh -c 'ip route | tr "\n" ";"; curl -sS -o /dev/null -m 8 -w " http=%{http_code}" https://example.com/' 2>&1)
            echo "$i: $out"; case "$out" in *http=200) ok=$((ok+1));; esac
          done
          echo "with-metric: $ok of 12 worked"
      - name: Specs
        working-directory: specs
        env:
          EGZO_BIN: ${{ github.workspace }}/bin/egzo
        run: |
          set -o pipefail
          ../specs/.venv/bin/pytest --engine podman -q agent/test_agent_containers.py -k nothing 2>&1 | tee ../specs-debug.log
      - name: Annotate
        if: failure()
        run: scripts/ci-annotate.sh "debug specs" specs-debug.log specs
