# TEMPORARY: what switches off forwarding on Podman's bridges. Removed once understood.
name: debug-podman
on:
  push:
    branches: [ci-spec-matrix]
jobs:
  debug:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: scripts/ci-engine.sh podman
      - name: Forwarding after each step
        run: |
          set +e
          show() { printf '%-46s' "$1"; for b in $(ip -br link | awk '/^(podman|docker0|br-)/{print $1}'); do printf '%s=%s ' $b $(cat /proc/sys/net/ipv4/conf/$b/forwarding); done; printf 'all=%s default=%s\n' $(cat /proc/sys/net/ipv4/conf/all/forwarding) $(cat /proc/sys/net/ipv4/conf/default/forwarding); }
          show "start"
          sudo podman network create a >/dev/null;                      show "podman network create a (external)"
          sudo podman run --rm --network a docker.io/library/alpine:3 true; show "podman run on a"
          sudo podman network create --internal b >/dev/null;            show "podman network create --internal b"
          sudo podman run --rm --network b docker.io/library/alpine:3 true; show "podman run on b"
          sudo podman run -d --name p1 --network a docker.io/library/alpine:3 sleep 300 >/dev/null; show "podman run -d on a"
          sudo podman network connect b p1;                              show "podman network connect b p1"
          sudo podman network create c >/dev/null;                       show "podman network create c"
          sudo podman network connect c p1;                              show "podman network connect c p1"
          sudo podman network disconnect c p1;                           show "podman network disconnect c p1"
          sudo podman network rm c >/dev/null;                           show "podman network rm c"
          docker run --rm docker.io/library/alpine:3 true;               show "docker run"
          docker network create dn >/dev/null;                           show "docker network create"
          docker run -d --name dr --network dn docker.io/library/alpine:3 sleep 300 >/dev/null; show "docker run -d on dn"
          docker rm -f dr >/dev/null; docker network rm dn >/dev/null;  show "docker rm / network rm"
          sudo podman run --rm --network a docker.io/library/alpine:3 true; show "podman run on a again"
          sleep 20;                                                      show "20 s later"
