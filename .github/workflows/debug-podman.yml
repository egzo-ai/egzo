# TEMPORARY: the rootful Podman failures of the specs, without the 50 minutes. Removed once they are fixed.
name: debug-podman
on:
  push:
    branches: [ci-spec-matrix]
jobs:
  debug:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: scripts/ci-engine.sh podman
      - run: |
          make build
          python -m venv specs/.venv
          specs/.venv/bin/pip install -r specs/requirements.txt
      - run: docker run -d --name spec-registry -p 5000:5000 registry:2
      - name: Who runs what
        run: |
          set +e
          for engine in "sudo podman" docker; do
            echo "=== $engine"
            $engine run --rm --init --user 1001:1001 --cap-drop ALL --security-opt no-new-privileges alpine:3 sh -c 'id; ps -o user,pid,ppid,args; ls -ln /proc/1/ | head -3; ls -ln /proc/1/fd/1; echo x > /proc/1/fd/1'
          done
          echo "=== podman exec"
          sudo podman run -d --name d1 --init --user 1001:1001 --cap-drop ALL alpine:3 sleep 300
          sudo podman exec d1 sh -c 'id; ps -o user,pid,args; echo x > /proc/1/fd/1; ls -ln /proc/1/fd/1'
      - name: Specs
        working-directory: specs
        env:
          EGZO_BIN: ${{ github.workspace }}/bin/egzo
        run: |
          set -o pipefail
          ../specs/.venv/bin/pytest --engine podman -q harness/test_harness_integrations.py -k "invoking" session/test_session_attach.py service browser 2>&1 | tee ../specs-debug.log
      - name: Annotate
        if: failure()
        run: scripts/ci-annotate.sh "debug specs" specs-debug.log specs
