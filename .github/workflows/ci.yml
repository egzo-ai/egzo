name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      - run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          make lint

  # The hub is its own Go module (hub/); core's job above never sees it, and this one never changes core's checks.
  hub:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make hub-web
      - run: make hub-web-test
      - run: make hub-build
      - run: make hub-test
      - run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          make hub-lint
      - name: The Docker engine implementation against a real engine and project
        run: make hub-integration
      - name: Browser tests
        run: make hub-e2e
      - name: The whole stack (hub image, Dex, a real project)
        run: make hub-stack

  # Every image builds for both architectures without being pushed, so a broken Dockerfile shows on the pull request
  # and not when a tag is pushed. The arm64 builds run under QEMU, with a cache.
  images:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: egzo (sidecar) image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=egzo
          cache-to: type=gha,scope=egzo,mode=max
      - name: hub image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: hub/Dockerfile
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=hub
          cache-to: type=gha,scope=hub,mode=max
      # The harness images copy the binary out of the egzo image, which is not pushed here, so they build on the runner's
      # own engine (amd64 only) against a locally built egzo image.
      - name: harness images
        run: |
          docker build -t egzo-ci:local .
          for h in claude-code opencode; do
            docker build --build-arg EGZO_IMAGE=egzo-ci:local harness/$h
          done
