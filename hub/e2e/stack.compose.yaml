# Added to compose.yaml by stack.sh: Dex as the hub's single sign-on, to test the OIDC path and linking for real. Its own ports, so
# it runs next to a real hub on 8080.
services:
  hub:
    ports: !override
      - "18080:8080"
    environment:
      EGZO_OIDC_ISSUER: http://dex:15556/dex
      EGZO_OIDC_CLIENT_ID: egzo-hub
      EGZO_OIDC_CLIENT_SECRET: ${EGZO_OIDC_CLIENT_SECRET:?}
      EGZO_OIDC_NAME: Dex
      EGZO_PREVIEW_DOMAIN: preview.localhost:18443
      EGZO_TRUSTED_PROXIES: 0.0.0.0/0
    depends_on:
      - dex

  # What terminates TLS in front of the hub. It is here to test the hub behind one, with real __Host- cookies: egzo ships no proxy.
  caddy:
    image: docker.io/library/caddy:2
    ports:
      - "18443:18443"
    volumes:
      - ./e2e/Caddyfile:/etc/caddy/Caddyfile:ro   # relative to compose.yaml, the first file
    depends_on:
      - hub

  dex:
    image: ghcr.io/dexidp/dex:v2.41.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    environment:
      EGZO_OIDC_CLIENT_SECRET: ${EGZO_OIDC_CLIENT_SECRET:?}
    ports:
      - "15556:15556"
    volumes:
      - ./e2e/dex.yaml:/etc/dex/config.yaml:ro   # relative to compose.yaml, the first file
