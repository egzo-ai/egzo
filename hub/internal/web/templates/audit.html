{{define "content"}}
<p class="crumbs"><a href="/">Projects</a> / <a href="{{.Data.Base}}">back to the project</a></p>
<h1>{{.Data.Title}}</h1>
<table class="list" data-testid="audit">
<thead><tr><th>When</th><th>Who</th><th>What</th><th>Agent</th><th>Detail</th></tr></thead>
<tbody>
{{range .Data.Rows}}<tr class="{{if not .Allowed}}refused{{end}}"><td>{{.At}}</td><td>{{.Actor}}</td><td>{{.Action}}{{if not .Allowed}} <span class="badge warn">refused</span>{{end}}</td><td>{{.Agent}}</td><td>{{.Detail}}</td></tr>{{end}}
</tbody>
</table>
{{end}}
