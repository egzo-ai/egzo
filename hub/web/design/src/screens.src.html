<title>egzo hub screens</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Martian+Mono:wght@300;400;500&display=swap">
<style>
/*@TOKENS@*/
/*@COMPONENTS@*/

/* ═══ App shell ═════════════════════════════════════════════════════════
   Layout: a left sidebar (open terminals, then projects, then account) and a stage.
   Pages scroll inside the stage; terminal views fill it and stay mounted when hidden.
   ≤720px the sidebar becomes the full-screen nav and the stage gets a one-line bar. */
html, body { height: 100%; }
.app { height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); min-height: 420px; display: grid; grid-template-columns: var(--nav-w) minmax(0, 1fr); min-width: 0; }
.app[data-rail] { grid-template-columns: var(--nav-w-rail) minmax(0, 1fr); }
.app[data-fullscreen] { grid-template-columns: 0 minmax(0, 1fr); }
.app[data-fullscreen] .side { overflow: hidden; border: 0; }

.side { display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; min-height: 0; background: var(--surface-1);
  border-right: 1px solid var(--border); padding-left: env(safe-area-inset-left, 0px); z-index: var(--z-tabbar); }
.side-head { display: flex; align-items: center; gap: var(--space-2); height: var(--hud-h); padding: 0 var(--space-2) 0 var(--space-3); border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: var(--space-2); color: var(--text); text-decoration: none; flex: 1; min-width: 0; }
.brand svg { width: 20px; height: 20px; flex: none; }
.brand b { font-family: var(--font-display); font-weight: 400; font-size: var(--text-sm); letter-spacing: -0.02em; }
.brand b span { color: var(--text-3); }
.goto { margin: var(--space-2); display: flex; align-items: center; gap: var(--space-2); height: var(--control-h); padding: 0 var(--space-2); font: inherit; font-size: var(--text-xs);
  color: var(--text-3); background: var(--bg); border: 1px solid var(--border-strong); border-radius: var(--radius-2); cursor: pointer; text-align: left; }
.goto:hover { color: var(--text-2); border-color: var(--text-3); }
.goto span.t { flex: 1; }
.side-scroll { overflow-y: auto; overflow-x: hidden; min-height: 0; padding-bottom: var(--space-3); scrollbar-width: thin; }
.side-h { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-3) var(--space-3) var(--space-1); }
.side-h .label { flex: 1; }
.side-h .count { font-size: var(--text-2xs); color: var(--text-3); }
.side-list { display: grid; gap: 1px; padding: 0 var(--space-2); }

.nav-item { position: relative; display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 0 var(--space-2); align-items: center; min-height: 28px; padding: 3px var(--space-2);
  color: var(--text-2); text-decoration: none; border-radius: var(--radius-1); cursor: pointer; font-size: var(--text-sm); }
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item[aria-current="page"], .nav-item[aria-current="true"] { background: var(--accent-soft); color: var(--text); }
.nav-item[aria-current="page"]::before, .nav-item[aria-current="true"]::before { content: ""; position: absolute; left: -8px; top: 4px; bottom: 4px; width: 2px; background: var(--accent); box-shadow: var(--glow-accent); }
.nav-item .ic { display: grid; place-items: center; color: var(--text-3); }
.nav-item .ini { display: none; }
.app[data-rail] .nav-item.proj .ic { display: none; }
.app[data-rail] .nav-item.proj .ini { display: grid; place-items: center; width: 24px; height: 20px; font-size: var(--text-2xs); text-transform: uppercase; border: 1px solid var(--border-strong); border-radius: var(--radius-1); color: var(--text-2); }
.nav-item .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-item .end { display: flex; gap: var(--space-1); align-items: center; }
.nav-item .end .engine { height: 16px; }
.nav-item .n { font-size: var(--text-2xs); color: var(--text-3); }
.nav-sub { display: grid; gap: 1px; padding-left: 24px; margin: 1px 0 var(--space-1); }
.nav-sub .nav-item { grid-template-columns: minmax(0, 1fr) auto; min-height: 24px; font-size: var(--text-xs); padding: 2px var(--space-2); }
.nav-sub .nav-item[aria-current="page"]::before { left: -8px; }
.qcount { font-size: 10px; font-weight: 800; color: var(--bg); background: var(--status-waiting); height: 14px; min-width: 14px; padding: 0 3px; display: grid; place-items: center; border-radius: var(--radius-1); }

/* Terminal entries: three lines, so the list says what each agent is doing without opening it. */
.term-item { position: relative; display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; grid-template-rows: auto auto auto; gap: 0 var(--space-2); padding: 5px var(--space-2) 6px;
  border-radius: var(--radius-1); cursor: pointer; color: var(--text-2); }
.term-item:hover { background: var(--surface-2); }
.term-item[aria-selected="true"] { background: var(--accent-soft); color: var(--text); }
.term-item[aria-selected="true"]::before { content: ""; position: absolute; left: -8px; top: 5px; bottom: 5px; width: 2px; background: var(--accent); box-shadow: var(--glow-accent); }
.term-item[data-visible]:not([aria-selected="true"])::before { content: ""; position: absolute; left: -8px; top: 5px; bottom: 5px; width: 2px; background: var(--accent-line); }
.term-item .glyph { grid-row: 1; display: grid; place-items: center; height: 18px; color: var(--text-3); }
.term-item .glyph .icon { width: 12px; height: 12px; }
.term-item .glyph[data-g="error"] { color: var(--status-error); font-size: 11px; }
.term-item .nm { grid-column: 2; font-size: var(--text-sm); font-weight: var(--weight-medium); color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 18px; }
.term-item[data-unread] .nm { font-weight: var(--weight-bold); }
.term-item .end { grid-column: 3; grid-row: 1; display: flex; gap: var(--space-1); align-items: center; height: 18px; }
.term-item .n { font-size: var(--text-2xs); color: var(--text-3); }
.term-item .where { grid-column: 2 / 4; font-size: var(--text-2xs); color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.term-item .what { grid-column: 2 / 4; font-size: var(--text-xs); color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.term-item .what[data-t="waiting"] { color: var(--status-waiting); }
.term-item .what[data-t="error"] { color: var(--status-error); }
.term-item .what[data-t="busy"] { color: var(--accent-text); }
.term-item .unread { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; box-shadow: var(--glow-accent); }
.term-item .x { width: 18px; height: 18px; display: grid; place-items: center; border-radius: var(--radius-1); color: var(--text-3); opacity: 0; }
.term-item:hover .x, .term-item[aria-selected="true"] .x, .term-item:focus-visible .x, .term-item:focus-within .x { opacity: 1; }
.term-item .x:hover { background: var(--surface-3); color: var(--text); }
.term-item:focus-visible { outline-offset: -2px; }
.side-empty { margin: 0 var(--space-3); padding: var(--space-2) var(--space-3); border: 1px dashed var(--border-strong); border-radius: var(--radius-2); font-size: var(--text-xs); color: var(--text-3); }
.side-add { margin: var(--space-1) var(--space-2) 0; }

.side-foot { border-top: 1px solid var(--border); padding: var(--space-2); display: grid; gap: var(--space-1); }
.side-foot .row { display: flex; align-items: center; gap: var(--space-1); }
.side-foot .row .grow { flex: 1; }
.health { display: flex; align-items: center; gap: var(--space-2); width: 100%; height: 26px; padding: 0 var(--space-2); font: inherit; font-size: var(--text-xs); color: var(--text-2);
  border: 1px solid transparent; background: none; border-radius: var(--radius-1); cursor: pointer; text-align: left; }
.health:hover { background: var(--surface-2); }
.health .t { flex: 1; }
.health[data-down] .warn { color: var(--status-unreachable); }
.me { display: inline-flex; align-items: center; gap: var(--space-2); padding: 0 var(--space-1); background: none; border: 0; color: var(--text-2); font: inherit; font-size: var(--text-xs); cursor: pointer; height: 28px; border-radius: var(--radius-2); min-width: 0; }
.me:hover { background: var(--surface-2); }

/* Rail: 52px, glyphs and numbers only; names in tooltips. */
.app[data-rail] .side .brand b, .app[data-rail] .side .goto .t, .app[data-rail] .side .goto .kbd, .app[data-rail] .side-h .label, .app[data-rail] .side-h .count,
.app[data-rail] .term-item .nm, .app[data-rail] .term-item .where, .app[data-rail] .term-item .what, .app[data-rail] .term-item .x, .app[data-rail] .nav-item .nm, .app[data-rail] .nav-item .end,
.app[data-rail] .nav-sub, .app[data-rail] .side-empty, .app[data-rail] .side-add .t, .app[data-rail] .health .t, .app[data-rail] .me .t, .app[data-rail] .side-foot .hide-rail { display: none; }
.app[data-rail] .term-item, .app[data-rail] .nav-item { grid-template-columns: 1fr; justify-items: center; padding: 6px 0; }
.app[data-rail] .term-item .end { grid-column: 1; grid-row: 2; }
.app[data-rail] .side-head { padding: 0; justify-content: center; flex-direction: column; height: auto; padding-block: var(--space-2); gap: var(--space-2); }
.app[data-rail] .brand { flex: none; }
.app[data-rail] .goto { justify-content: center; padding: 0; }
.app[data-rail] .side-h { justify-content: center; padding: var(--space-2) 0 var(--space-1); }
.app[data-rail] .side-h::after { content: ""; width: 20px; height: 1px; background: var(--border); }
.app[data-rail] .side-add { display: flex; justify-content: center; }
.app[data-rail] .side-foot .row { flex-direction: column; }
.app[data-rail] .health { justify-content: center; padding: 0; }

.stage { position: relative; min-height: 0; min-width: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); }
.mbar { display: none; grid-row: 1; }
.viewport { position: relative; min-height: 0; grid-row: 2; }
.hubview { position: absolute; inset: 0; overflow: auto; }
.termview { position: absolute; inset: 0; display: grid; gap: 1px; background: var(--border); }
.termview[data-layout="1"] { grid-template-columns: 1fr; }
.termview[data-layout="2"] { grid-template-columns: 1fr 1fr; }
.termview[data-layout="4"] { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }

/* ═══ Hub pages ═══ */
.page { max-width: var(--content-max); margin: 0 auto; padding-block: var(--space-5) var(--space-8);
  padding-left: max(var(--space-5), env(safe-area-inset-left, 0px)); padding-right: max(var(--space-5), env(safe-area-inset-right, 0px)); display: grid; gap: var(--space-4); align-content: start; }
.page[data-narrow] { max-width: 760px; }
.crumbs { font-size: var(--text-xs); color: var(--text-3); display: flex; gap: var(--space-1); flex-wrap: wrap; align-items: center; }
.crumbs a { color: var(--text-2); text-decoration: none; }
.crumbs a:hover { color: var(--accent-text); text-decoration: underline; }
.phead { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
.phead .grow { flex: 1; }
.phead .h-page .sep { color: var(--text-3); }
.metaline { display: flex; gap: var(--space-4); flex-wrap: wrap; font-size: var(--text-xs); color: var(--text-2); align-items: center; }
.metaline .k { color: var(--text-3); }
.toolbar { display: flex; gap: var(--space-3); align-items: center; flex-wrap: wrap; }
.toolbar .grow { flex: 1; }
.search { position: relative; width: min(260px, 100%); }
.search .icon { position: absolute; left: 8px; top: 6px; color: var(--text-3); }
.search .input { padding-left: 28px; padding-right: 28px; }
.search .kbd { position: absolute; right: 6px; top: 5px; }
.agentsbar { display: inline-flex; gap: 1px; height: 6px; width: 64px; vertical-align: middle; margin-right: var(--space-2); background: var(--surface-3); }
.agentsbar i { display: block; height: 100%; }
.agentsbar .r { background: var(--status-running); } .agentsbar .w { background: var(--status-waiting); } .agentsbar .s { background: var(--border-strong); }
.twocol { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--space-4); }
.panel { border: 1px solid var(--border); border-radius: var(--radius-2); background: var(--surface-1); min-width: 0; }
.panel > header { display: flex; align-items: center; gap: var(--space-2); padding: 0 var(--space-3); height: 32px; border-bottom: 1px solid var(--border); }
.panel > header .grow { flex: 1; }
.panel > .pad { padding: var(--space-3); display: grid; gap: var(--space-3); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: var(--space-1) var(--space-4); margin: 0; font-size: var(--text-sm); }
.kv dt { color: var(--text-3); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.statusline { font-size: var(--text-md); color: var(--text); padding: var(--space-3); background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius-2); display: flex; gap: var(--space-3); align-items: center; flex-wrap: wrap; }
.statusline .q { color: var(--status-waiting); }
.termcard { display: flex; gap: var(--space-3); align-items: center; flex-wrap: wrap; padding: var(--space-3); border: 1px solid var(--accent-line); background: var(--accent-soft); border-radius: var(--radius-2); }
.termcard .grow { flex: 1; min-width: 200px; }
.spec { margin: 0; font-size: 12px; line-height: 1.55; background: var(--term-bg); color: var(--term-fg); border: 1px solid var(--border); border-radius: var(--radius-2); overflow: auto; counter-reset: ln; padding: var(--space-3) 0; }
.spec span.l { display: block; padding-right: var(--space-4); white-space: pre; }
.spec span.l::before { counter-increment: ln; content: counter(ln); display: inline-block; width: 4ch; margin-right: 2ch; text-align: right; color: var(--term-bright-black); }
.spec .k { color: var(--term-yellow); } .spec .c { color: var(--term-bright-black); } .spec .s { color: var(--term-green); } .spec .v { color: var(--term-cyan); }
.roles { display: grid; grid-template-columns: max-content 1fr; gap: var(--space-1) var(--space-4); font-size: var(--text-xs); color: var(--text-2); margin: 0; }
.roles dt { color: var(--text); }
.roles dd { margin: 0; }
.drawer { border: 1px solid var(--border-strong); border-radius: var(--radius-2); background: var(--surface-1); display: grid; }
.drawer > header { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border); }
.drawer > header h2 { margin: 0; font-size: var(--text-md); flex: 1; }
.drawer .content { padding: var(--space-4); display: grid; gap: var(--space-4); }
.drawer footer { display: flex; gap: var(--space-2); padding: var(--space-3) var(--space-4); border-top: 1px solid var(--border); justify-content: flex-end; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); }
.fp { font-size: var(--text-md); letter-spacing: .02em; padding: var(--space-3); background: var(--term-bg); color: var(--term-fg); border: 1px solid var(--border-strong); border-radius: var(--radius-2); overflow-wrap: anywhere; line-height: 1.6; }
.fp .h { color: var(--accent-text); }

/* Sign-in */
.signin { min-height: 100%; display: grid; place-items: center; padding: var(--space-6) max(16px, env(safe-area-inset-left, 0px)); }
.signin .box { width: min(440px, 100%); display: grid; gap: var(--space-5); }
.signin .mark { display: flex; align-items: center; gap: var(--space-3); }
.signin .mark svg { width: 44px; height: 44px; }
.signin .mark b { font-family: var(--font-display); font-weight: 300; font-size: var(--text-2xl); letter-spacing: -0.03em; }
.boot { margin: 0; font-size: var(--text-xs); color: var(--text-3); line-height: 1.7; white-space: pre-wrap; }
.boot .ok { color: var(--status-running); }
.boot .cur { display: inline-block; width: .6em; height: 1.1em; background: var(--accent); vertical-align: -2px; animation: blink var(--blink); box-shadow: var(--glow-accent); }

/* ═══ Terminal panes ═══ */
.tpane { display: grid; grid-template-rows: 30px minmax(0, 1fr) 22px; background: var(--term-bg); min-width: 0; min-height: 0; position: relative; outline: none; }
.tpane::after { content: ""; position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 0 1px transparent; }
.termview:not([data-layout="1"]) .tpane[data-focus]::after { box-shadow: inset 0 0 0 1px var(--accent); }
.tpane:focus-visible::after { box-shadow: inset 0 0 0 2px var(--focus); }
.thead { display: flex; align-items: center; gap: var(--space-2); padding: 0 var(--space-1) 0 var(--space-3); background: var(--surface-1); border-bottom: 1px solid var(--border); min-width: 0; font-size: var(--text-xs); }
.thead .id { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; color: var(--text-3); }
.thead .id b { color: var(--text); font-weight: var(--weight-bold); }
.thead .grow { flex: 1; }
.thead .tools { display: flex; gap: 2px; flex: none; }
.tbody { position: relative; overflow: hidden; min-height: 0; }
.screen { margin: 0; padding: 6px 10px; font-family: var(--font-term); font-size: var(--term-font-size); line-height: var(--term-line-height); color: var(--term-fg); white-space: pre; height: 100%; overflow: hidden; }
.tpane[data-state]:not([data-state="connected"]) .screen { opacity: .28; filter: saturate(.4); }
.tpane[data-state="connecting"] .screen { opacity: 0; }
.tfoot { display: flex; align-items: center; gap: var(--space-3); padding: 0 var(--space-3); font-size: var(--text-2xs); color: var(--text-3); background: var(--surface-1); border-top: 1px solid var(--border); white-space: nowrap; overflow: hidden; }
.tfoot .grow { flex: 1; }
.tfoot .st { display: inline-flex; gap: 6px; align-items: center; color: var(--text-2); }
.cur { display: inline-block; width: .6em; background: var(--term-cursor); color: var(--term-cursor-accent); animation: blink var(--blink); }
/* ANSI */
.fg-r { color: var(--term-red); } .fg-g { color: var(--term-green); } .fg-y { color: var(--term-yellow); } .fg-b { color: var(--term-blue); }
.fg-m { color: var(--term-magenta); } .fg-c { color: var(--term-cyan); } .fg-w { color: var(--term-white); } .fg-k { color: var(--term-bright-black); }
.fg-R { color: var(--term-bright-red); } .fg-G { color: var(--term-bright-green); } .fg-W { color: var(--term-bright-white); } .fg-M { color: var(--term-bright-magenta); }
.bg-g { background: color-mix(in srgb, var(--term-green) 18%, transparent); } .bg-r { background: color-mix(in srgb, var(--term-red) 18%, transparent); }
.b { font-weight: 700; }
.cell { display: inline-block; width: 1ch; text-align: center; overflow: visible; } .inv { background: var(--term-fg); color: var(--term-bg); }

/* Terminal state overlay */
.tstate { position: absolute; inset: 0; display: grid; place-items: center; padding: var(--space-4); z-index: 2; }
.tcard { width: min(520px, 100%); background: var(--surface-1); border: 1px solid var(--border-strong); border-radius: var(--radius-3); box-shadow: var(--shadow-float); display: grid; gap: var(--space-3); padding: var(--space-4); }
.tcard h3 { margin: 0; font-size: var(--text-md); display: flex; gap: var(--space-2); align-items: center; }
.tcard p { margin: 0; color: var(--text-2); font-size: var(--text-sm); }
.tcard .acts { display: flex; gap: var(--space-2); flex-wrap: wrap; }
.tcard[data-tone="error"] { border-color: var(--status-error); }
.tcard[data-tone="error"] h3 { color: var(--status-error); }
.tcard[data-tone="taken"] h3, .tcard[data-tone="busy"] h3 { color: var(--accent-text); }
.connecting { font-size: var(--text-sm); color: var(--text-2); display: grid; gap: 4px; }
.connecting .ok { color: var(--status-running); }
.connecting .now { color: var(--accent-text); }
.compact .tcard { padding: var(--space-3); gap: var(--space-2); }
.compact .tcard p.more { display: none; }

/* Leader HUD */
.leader { position: fixed; left: 50%; bottom: calc(var(--space-6) + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: var(--z-hud);
  width: min(640px, calc(100vw - 32px)); background: var(--surface-3); border: 1px solid var(--accent); border-radius: var(--radius-3); box-shadow: var(--shadow-float), var(--glow-accent); padding: var(--space-3) var(--space-4); display: grid; gap: var(--space-3); }
.leader header { display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-xs); color: var(--accent-text); }
.leader header .grow { flex: 1; }
.leader .keys { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-1) var(--space-4); font-size: var(--text-xs); }
.leader .keys div { display: flex; gap: var(--space-2); align-items: center; color: var(--text-2); }
.leader .keys .kbd { color: var(--text); }

/* Command menu */
.palette { position: fixed; left: 50%; top: 12vh; transform: translateX(-50%); width: min(560px, calc(100vw - 32px)); z-index: var(--z-dialog); background: var(--surface-3); border: 1px solid var(--border-strong); border-radius: var(--radius-3); box-shadow: var(--shadow-float); overflow: hidden; }
.palette .q { display: flex; align-items: center; gap: var(--space-2); padding: 0 var(--space-3); height: 40px; border-bottom: 1px solid var(--border); }
.palette .q span { color: var(--accent-text); font-weight: 800; }
.palette input { flex: 1; background: none; border: 0; color: var(--text); font: inherit; font-size: var(--text-md); outline: none; }
.palette .list { max-height: 50vh; overflow: auto; padding: var(--space-1); display: grid; }
.palette .grp { padding: var(--space-2) var(--space-2) 2px; }

    return `<tr ${i === 0 ? 'aria-selected="true"' : ''}>

/* ---------- terminals ---------- */
function stateOverlay(t) {
  const who = t.holder ? P[t.holder] : P.mc;
  const id = `${t.engine}:${t.project}/${t.agent}`;
  switch (t.state) {
    case 'connecting': return `<div class="tstate"><div class="connecting" role="status"><span class="ok">✓ websocket open</span><span class="ok">✓ agent ${t.agent} is running</span><span class="now">› attaching to the pty <span class="cur"> </span></span></div></div>`;
    case 'busy': return `<div class="tstate"><div class="tcard" data-tone="busy" role="alert"><h3>${ic('lock')}${who.name} is at this terminal</h3>
      <p>Since 14:22. There's one terminal per agent and no watch-only mode, so taking over disconnects them.</p>
      <div class="acts"><button class="btn" data-variant="primary" data-take="${t.id}">Take over</button><button class="btn" data-close="${t.id}">Close tab</button></div></div></div>`;
    case 'taken': return `<div class="tstate"><div class="tcard" data-tone="taken" role="alert"><h3>${ic('swap')}${who.name} took over at 14:41</h3>
      <p>You've been disconnected. What you see is the last screen you had; it no longer updates.</p>
      <div class="acts"><button class="btn" data-variant="primary" data-take="${t.id}">Take it back</button><button class="btn" data-close="${t.id}">Close tab</button></div></div></div>`;
    case 'disconnected': return `<div class="tstate"><div class="tcard" role="alert"><h3>${ic('plug-off')}Connection lost</h3>
      <p>The connection to the hub dropped. Retrying in 4s (attempt 2 of 5). The agent keeps running.</p>
      <div class="acts"><button class="btn" data-variant="primary" data-reconnect="${t.id}">${ic('refresh')}Reconnect now</button><button class="btn" data-close="${t.id}">Close tab</button></div></div></div>`;
    case 'error': return `<div class="tstate"><div class="tcard" data-tone="error" role="alert"><h3>✕ Can't attach to ${id}</h3>
      <p>Engine ${t.engine} is unreachable: ${esc(ENGINES[2].err)}.</p><p class="more muted">The tab stays open and reconnects when you ask. Nothing on the engine was changed.</p>
      <div class="acts"><button class="btn" data-variant="primary" data-reconnect="${t.id}">${ic('refresh')}Reconnect</button><button class="btn" data-close="${t.id}">Close tab</button></div></div></div>`;
    case 'stopped': return `<div class="tstate"><div class="tcard" role="status"><h3>■ ${t.agent} stopped</h3>
      <p>The agent exited with code 0 at 14:44. Its workspace is kept until someone removes the agent.</p>
      <div class="acts"><button class="btn" data-variant="primary" data-start="${t.id}">${ic('play')}Start and reconnect</button><button class="btn" data-close="${t.id}">Close tab</button></div></div></div>`;
  }
  return '';
}
function pane(id, i) {
  const t = tabById(id); if (!t) return '<div class="tpane"></div>';
  const focus = i === S.focusPane;
  const foot = { connected: `<span class="st"><span class="dot" data-s="${t.act}"></span>${actLabel[t.act]}</span><span class="presence"><span class="avatar" data-me>CV</span>you hold it</span>`,
    connecting: `<span class="st"><span class="dot" data-s="starting"></span>connecting</span>`, busy: `<span class="st">${ic('lock', 'data-size="sm"')}held by ${P[t.holder || 'mc'].name}</span>`,
    taken: `<span class="st">${ic('swap', 'data-size="sm"')}taken over</span>`, disconnected: `<span class="st">${ic('plug-off', 'data-size="sm"')}disconnected · retrying</span>`,
    error: `<span class="st" style="color:var(--status-error)">✕ error</span>`, stopped: `<span class="st"><span class="dot" data-s="stopped"></span>agent stopped</span>` }[t.state];
  return `<section class="tpane ${S.layout > 1 ? 'compact' : ''}" data-state="${t.state}" ${focus ? 'data-focus' : ''} tabindex="0" aria-label="Terminal ${t.agent}" data-pane="${i}">
    <div class="thead"><span class="id">${S.multi ? t.engine + ':' : ''}${t.project}/<b>${t.agent}</b></span>${t.state === 'connected' ? pill(t.act, actLabel[t.act]) : ''}<span class="grow"></span>
      <div class="tools">
        <button class="btn" data-variant="quiet" data-size="sm" data-icon-only aria-label="Agent page" title="Agent page" data-go="agent">${ic('file', 'data-size="sm"')}</button>
        <button class="btn" data-variant="quiet" data-size="sm" data-icon-only aria-label="Pop out into a window" title="Pop out (Ctrl+] p)">${ic('popout', 'data-size="sm"')}</button>
        <button class="btn" data-variant="quiet" data-size="sm" data-icon-only aria-label="Full screen" title="Full screen (Ctrl+] f)" data-act="fullscreen">${ic('max', 'data-size="sm"')}</button>
        <button class="btn" data-variant="quiet" data-size="sm" data-icon-only aria-label="Close terminal" title="Detach and close (Ctrl+] d)" data-close="${t.id}">${ic('x', 'data-size="sm"')}</button>
      </div></div>
    <div class="tbody"><pre class="screen">${cells(SCREENS[t.scr]())}</pre>${stateOverlay(t)}</div>
    <div class="tfoot">${foot}<span class="grow"></span><span class="hide-sm">${S.layout === 1 ? '132×41' : S.layout === 2 ? '78×41' : '78×19'}</span><span><span class="kbd">Ctrl</span>+<span class="kbd">]</span> then <span class="kbd">?</span> keys</span></div>
  </section>`;
}
function termView() {
  const layoutBtns = S.layout;

function layoutSwitch() {

function dialog() {
  const d = S.dialog; if (!d) return '';

    <div class="content" id="dd"><ul class="consequence"><li>Deletes the container, its network and its workspace.</li><li>Uncommitted changes in the workspace are lost.</li><li>Anyone at its terminal is disconnected.</li></ul><p class="muted" style="margin:0">This can't be undone. The audit log keeps a record.</p></div>
    <footer><button class="btn" data-dlg="close">Cancel</button><button class="btn" data-variant="danger-solid" data-dlg="removed">Remove ${d.name}</button></footer></div>`;
  if (d.k === 'role') h = `<div class="dialog" data-tone="danger" role="alertdialog" aria-modal="true" aria-labelledby="dh"><header><h2 id="dh">Make ${P[d.who].name} ${d.role === 'owner' ? 'an owner' : d.role === 'administrator' ? 'an administrator' : 'a user'}?</h2></header>
    <div class="content"><ul class="consequence">${d.role === 'owner' ? '<li>They can add and remove people, including you.</li><li>They can operate every agent in payments.</li>' : d.role === 'administrator' ? '<li>They can start, stop, attach to and remove every agent in payments.</li><li>They can read the audit log.</li>' : '<li>They keep access to their own agents only.</li><li>They lose access to other people\'s terminals; if they hold one, they are disconnected.</li>'}</ul></div>
    <footer><button class="btn" data-dlg="close">Cancel</button><button class="btn" data-variant="danger-solid" data-dlg="role-ok">Change role</button></footer></div>`;
  if (d.k === 'rm-member') h = `<div class="dialog" data-tone="danger" role="alertdialog" aria-modal="true" aria-labelledby="dh"><header><h2 id="dh">Remove ${P[d.name].name} from payments?</h2></header>
    <div class="content"><ul class="consequence"><li>They lose access to the project and its terminals right away.</li><li>Their agents keep running; administrators can still operate them.</li></ul></div>
    <footer><button class="btn" data-dlg="close">Cancel</button><button class="btn" data-variant="danger-solid" data-dlg="member-removed">Remove access</button></footer></div>`;
  if (d.k === 'engine-rm') h = `<div class="dialog" data-tone="danger" role="alertdialog" aria-modal="true" aria-labelledby="dh"><header><h2 id="dh">Forget engine ${d.name}?</h2></header>

    <footer><button class="btn" data-dlg="close">Cancel</button><button class="btn" data-variant="danger-solid" data-dlg="engine-gone">Forget engine</button></footer></div>`;

    <div class="content"><p class="dim" style="margin:0">This is the first connection to this server. It presented the key below. Check it against the server before you trust it; after you pin it, any other key is refused.</p>
    <div class="fp"><span class="muted">ED25519</span> SHA256:<span class="h">q9Xw</span>vM2k<span class="h">Lr8T</span>c0Pa<span class="h">nZ4e</span>Y1uB<span class="h">7sJd</span>Hk3f<span class="h">Wm6Q</span>oR2x</div>
    <div class="field"><span class="label-text">On the server, run</span><code style="padding:6px 8px">ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub</code></div></div>
    <footer><button class="btn" data-dlg="close">Cancel</button><button class="btn" data-variant="primary" data-dlg="pinned">Pin this key and save</button></footer></div>`;
  if (d.k === 'help') h = `<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dh" style="width:min(620px,100%)"><header><h2 id="dh">Keyboard</h2><button class="btn" data-variant="quiet" data-size="sm" data-icon-only aria-label="Close" data-dlg="close">${ic('x')}</button></header>
    <div class="content">${keymapHTML()}</div></div>`;

const LEADER_KEYS = [['1–9', 'go to terminal n'], ['↑ ↓', 'previous / next terminal'], ['h', 'back to the last page'], ['n', 'focus the sidebar'], ['b', 'collapse / expand sidebar'], ['s', 'split: 1 → 2 → 4'], ['o', 'focus the other pane'], ['f', 'full screen on / off'], ['p', 'pop out to a window'], ['d', 'detach and close tab'], [':', 'command menu'], [']', 'send Ctrl+] to the agent'], ['?', 'all shortcuts'], ['Esc', 'cancel']];

function paletteHTML() {

const PROTO = [
  ['Screens', [['signin', 'Sign-in'], ['signin-err', 'Sign-in: provider error'], ['home', 'Home: 3 engines, 1 unreachable'], ['home-single', 'Home: single engine'], ['home-empty', 'Home: no access yet'], ['engines', 'Engines (operator)'], ['engines-add', 'Engines: add + inline error'], ['hostkey', 'Engines: confirm ssh host key'],
    ['project', 'Project: agents'], ['p-services', 'Project: services'], ['p-timeline', 'Project: timeline'], ['p-spec', 'Project: resolved spec'], ['p-audit', 'Project: audit log'], ['p-members', 'Project: members'], ['p-down', 'Project: sidecars down'], ['agent', 'Agent: waiting on a question'], ['agent-logs', 'Agent: logs'], ['agent-down', 'Agent: engine down'], ['forbidden', 'No permission (403)'], ['notfound', 'Not found (404)']]],

/* ---------- render ---------- */

    `<div class="app" ${S.fullscreen ? 'data-fullscreen' : ''} ${S.rail ? 'data-rail' : ''} ${S.navOpen ? 'data-nav-open' : ''}>${sidebar()}

  else if (S.dialog) { const b = $('.dialog[data-tone="danger"] input') || $('.dialog[data-tone="danger"] footer .btn') || $('.dialog input, .dialog select, .dialog footer .btn:last-child'); b && b.focus(); }
}

/* ---------- actions ---------- */
function go(screen) { S.screen = screen; S.active = 0; S.fullscreen = false; S.navOpen = false; render(); $('.hubview') && ($('.hubview').scrollTop = 0); }
function openTab(id) {

}

}
function attach(name) {

}

function cycleTab(d) { const ids = [0, ...S.tabs.map((t) => t.id)]; const i = ids.indexOf(S.active); const n = ids[(i + d + ids.length) % ids.length]; n ? openTab(n) : (S.active = 0, render()); }
function toggleTheme() { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; render(); }
function activeTab() { return tabById(S.panes[S.focusPane] || S.active) || S.tabs[0]; }

function proto(k) {
  S.lastProto = k; S.rail = k === 'rail'; S.navOpen = k === 'mobile'; S.dialog = null; S.leader = false; S.palette = false; S.fullscreen = false; S.signinError = false; S.projectDown = false; S.enginesForm = false; S.agentTab = 'timeline';

  else if (k === 'tfs') { ensureTerm(); S.fullscreen = true; toast('Full screen. Press Ctrl+] then f to leave.'); }
  else if (k === 'leader') { ensureTerm(); S.leader = true; }
  else if (k === 'palette') { S.palette = true; S.paletteQ = ''; S.paletteSel = 0; }

}

/* ---------- events ---------- */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-close],[data-tab],[data-psect],[data-go],[data-act],[data-ptab],[data-atab],[data-open],[data-attach],[data-take],[data-reconnect],[data-start],[data-layout],[data-dlg],[data-dlg-scrim],[data-pal-scrim],[data-pi],[data-proto],[data-proto-toggle],[data-theme-set],[data-filter],[data-pane]');
  if (!el) return;

  if (d.go) { e.preventDefault(); return go(d.go); }
  if (d.ptab) { S.projTab = d.ptab; return render(); }
  if (d.psect) { e.preventDefault(); S.projTab = d.psect; return go('project'); }
  if (d.atab) { S.agentTab = d.atab; return render(); }
  if (d.open) return openTab(+d.open);
  if (d.attach) return attach(d.attach);
  if (d.take) { const t = tabById(+d.take); t.state = 'connecting'; render(); setTimeout(() => { t.state = 'connected'; t.holder = null; render(); toast(`You hold <b>${t.agent}</b>. ${P.mc.name} was disconnected and notified.`); }, 900); return; }
  if (d.reconnect) { const t = tabById(+d.reconnect); t.state = 'connecting'; render(); setTimeout(() => { t.state = t.engine === 'gpu-box' ? 'error' : 'connected'; render(); }, 1200); return; }
  if (d.start) { const t = tabById(+d.start); t.state = 'connecting'; render(); setTimeout(() => { t.state = 'connected'; render(); }, 1200); return; }
  if (d.layout) return setLayout(+d.layout);
  if (d.filter) { S.homeFilter = d.filter; return render(); }
  if (d.pane !== undefined && !e.target.closest('button')) { S.focusPane = +d.pane; S.active = S.panes[S.focusPane]; return render(); }
  if (d.protoToggle !== undefined) { S.proto = !S.proto; return render(); }
  if (d.proto) return proto(d.proto);
  if (d.themeSet) { if (d.themeSet === 'system') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = d.themeSet; return render(); }
  if (d.dlgScrim !== undefined && e.target === el) { S.dialog = null; return render(); }
  if (d.palScrim !== undefined) { S.palette = false; return render(); }
  if (d.pi) { const x = S._pal[+d.pi]; S.palette = false; x.a(); return render(); }
  if (d.dlg) {
    const k = d.dlg, dd = S.dialog; S.dialog = null; render();
    if (k === 'spawn') { toast('Spawned <b>claude-7f3a</b> in payments.'); }
    if (k === 'removed') toast(`Removed <b>${dd.name}</b> and its workspace.`);
    if (k === 'role-ok') toast(`${P[dd.who].name} is now ${dd.role === 'owner' ? 'an owner' : 'an ' + dd.role}.`);
    if (k === 'member-removed') toast(`${P[dd.name].name} no longer has access to payments.`);
    if (k === 'engine-gone') toast(`Forgot engine <b>${dd.name}</b>.`);
    if (k === 'pinned') { S.enginesForm = false; render(); toast('Pinned the host key and saved <b>build-farm</b>. It is reachable.'); }
    return;
  }
  if (d.act) {
    const a = d.act;
    if (a === 'palette') { S.palette = true; S.paletteQ = ''; S.paletteSel = 0; }
    if (a === 'theme') return toggleTheme();
    if (a === 'rail') S.rail = !S.rail;
    if (a === 'nav') S.navOpen = !S.navOpen;
    if (a === 'spawn') S.dialog = { k: 'spawn' };
    if (a === 'rm-agent') S.dialog = { k: 'rm-agent', name: d.name };
    if (a === 'rm-member') S.dialog = { k: 'rm-member', name: d.name };
    if (a === 'engine-add' || a === 'engine-edit') S.enginesForm = true;
    if (a === 'engine-close') S.enginesForm = false;
    if (a === 'engine-rm') S.dialog = { k: 'engine-rm', name: d.name };
    if (a === 'hostkey') S.dialog = { k: 'hostkey' };
    if (a === 'fullscreen') { S.fullscreen = !S.fullscreen; if (S.fullscreen) toast('Full screen. Press Ctrl+] then f to leave.'); }
    render();
  }
});
document.addEventListener('change', (e) => { const r = e.target.dataset.role; if (r) { S.dialog = { k: 'role', who: r, role: e.target.value }; render(); } });
document.addEventListener('input', (e) => { if (e.target.id === 'palq') { S.paletteQ = e.target.value; S.paletteSel = 0; render(); } });
document.addEventListener('keydown', (e) => {
  const inField = e.target.matches('input, textarea, select');
  // Leader: Ctrl+] works everywhere, including inside a terminal.
  if (e.ctrlKey && (e.key === ']' || e.code === 'BracketRight')) { e.preventDefault(); S.leader = !S.leader; return render(); }
  if (S.leader) {
    e.preventDefault(); S.leader = false; const k = e.key;
    if (/^[1-9]$/.test(k)) { const t = S.tabs[+k - 1]; return t ? openTab(t.id) : render(); }
    if (k === 'ArrowDown' || k === 'ArrowRight') return cycleTab(1);
    if (k === 'ArrowUp' || k === 'ArrowLeft') return cycleTab(-1);
    if (k === 'h') { S.active = 0; S.fullscreen = false; return render(); }
    if (k === 'b') { S.rail = !S.rail; return render(); }
    if (k === 'n') { S.rail = false; S.fullscreen = false; render(); const f = $('.side .nav-focus[tabindex="0"]') || $('.side .nav-focus'); return f && f.focus(); }
    if (k === 's') return setLayout(S.layout === 1 ? 2 : S.layout === 2 ? 4 : 1);
    if (k === 'o' && S.panes.length > 1) { S.focusPane = (S.focusPane + 1) % S.panes.length; S.active = S.panes[S.focusPane]; render(); const p = document.querySelector(`.tpane[data-pane="${S.focusPane}"]`); return p && p.focus(); }
    if (k === 'f') { S.fullscreen = !S.fullscreen; return render(); }
    if (k === 'd' && S.active) return closeTab(S.active);
    if (k === ':') { S.palette = true; S.paletteQ = ''; S.paletteSel = 0; return render(); }
    if (k === '?') { S.dialog = { k: 'help' }; return render(); }
    if (k === ']') { render(); return toast('Sent Ctrl+] to the agent.'); }
    return render();
  }
  if (S.palette) {
    if (e.key === 'Escape') { S.palette = false; return render(); }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); S.paletteSel = Math.max(0, Math.min((S._pal || []).length - 1, S.paletteSel + (e.key === 'ArrowDown' ? 1 : -1))); return render(); }
    if (e.key === 'Enter') { const x = (S._pal || [])[S.paletteSel]; S.palette = false; if (x) x.a(); return render(); }
    return;
  }
  if (S.dialog && e.key === 'Escape') { S.dialog = null; return render(); }
  // Sidebar keyboard.
  // Sidebar: one tab stop; ↑/↓ move through terminals and projects, Enter opens, Delete closes a terminal.
  if (e.target.classList.contains('nav-focus') && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    e.preventDefault(); const all = [...document.querySelectorAll('.side .nav-focus')]; const i = all.indexOf(e.target); const n = all[Math.max(0, Math.min(all.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)))]; n.focus(); return;
  }
  if (e.target.classList.contains('term-item') && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); return e.target.click(); }
  if (e.target.classList.contains('term-item') && e.key === 'Delete') return closeTab(+e.target.dataset.tab);
  if (e.target.closest('.tpane') || inField || S.dialog) return; // the terminal owns its keys
  if (e.key === ':' || (e.ctrlKey && e.key.toLowerCase() === 'k')) { e.preventDefault(); S.palette = true; S.paletteQ = ''; S.paletteSel = 0; return render(); }
  if (e.key === '?') { S.dialog = { k: 'help' }; return render(); }
  if (e.key === '/' && $('#q')) { e.preventDefault(); return $('#q').focus(); }
  if (e.key === 's' && S.screen === 'project' && !S.active) { S.dialog = { k: 'spawn' }; return render(); }
});
render();
