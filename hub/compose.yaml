# The egzo hub: a web UI over the egzo projects that link to it. It mounts nothing of the host: projects dial in.
#
#   cp .env.example .env     # set EGZO_PUBLIC_URL
#   docker compose up -d
#   docker compose logs hub  # the admin password, printed once
#   open http://localhost:8080
name: egzo-hub

services:
  hub:
    image: ghcr.io/egzo-ai/egzo-hub:${EGZO_HUB_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "8080:8080"           # meant for a private network (LAN, Tailscale, a tunnel), not the open internet
    environment:
      # The address projects name in `hub:`. A link in a container reaches it, so not localhost.
      EGZO_PUBLIC_URL: ${EGZO_PUBLIC_URL:?set EGZO_PUBLIC_URL in .env}
      # When projects reach the hub at another address, or on a listener of its own that serves links and no page.
      EGZO_LINK_URL: ${EGZO_LINK_URL:-}
      EGZO_LINK_LISTEN: ${EGZO_LINK_LISTEN:-}
      # The starter account, admin: a password from here (saved at every start), else one printed once in the log.
      EGZO_ADMIN_PASSWORD: ${EGZO_ADMIN_PASSWORD:-}
      EGZO_LOCAL_LOGIN: ${EGZO_LOCAL_LOGIN:-true}
      # Single sign-on, optional: your OpenID Connect provider. See docs/hub-access.md.
      EGZO_OIDC_ISSUER: ${EGZO_OIDC_ISSUER:-}
      EGZO_OIDC_CLIENT_ID: ${EGZO_OIDC_CLIENT_ID:-}
      EGZO_OIDC_CLIENT_SECRET: ${EGZO_OIDC_CLIENT_SECRET:-}
      EGZO_OIDC_NAME: ${EGZO_OIDC_NAME:-}
      EGZO_TRUSTED_PROXIES: ${EGZO_TRUSTED_PROXIES:-}
    volumes:
      - hub-data:/data

volumes:
  hub-data:
